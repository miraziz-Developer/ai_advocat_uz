services:
  - type: web
    name: ai-advokat-uz
    runtime: python
    plan: free
    region: ohio  # same AWS region as the Neon database (us-east-2)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CARD_NUMBER
        sync: false
      - key: CARD_HOLDER
        sync: false
      - key: DOC_PRICE
        value: "15000"
      - key: FREE_DAILY_LIMIT
        value: "25"
