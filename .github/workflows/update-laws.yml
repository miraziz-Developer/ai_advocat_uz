# Weekly refresh of laws from lex.uz (free on GitHub Actions). Unchanged laws are skipped.
name: update-laws
on:
  schedule:
    - cron: "0 22 * * 0"   # Monday 03:00 Tashkent
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m app.ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
